<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="stylesheet" href="tree.css">
<style>
  :root { --bg: #14161a; --ink: #e8eaed; --muted: #a9b0bb; --line: #6b7280; --card: #1f232a; --status-next: #8ab4ff; --focus-ring: #14b8a5; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  main a { color: var(--status-next); }
</style>
</head>
<body>
<p class="early-version">An early version of the ClickChain Roadmap UI, kept as a code sample. The current version is live on clickchain.ai. This repository's README has the link.</p>
<main>
<h1>Portfolio</h1>
<div id="app"></div>
</main>
<script type="module">
  import { loadPortfolio } from "../src/portfolio.js";
  import { renderPortfolio } from "../src/render.js";

  const io = {
    fetch: (path, options) => fetch(new URL(`../${path}`, location.href), options),
    now: () => new Date().toISOString(),
  };
  const results = await loadPortfolio(io);
  document.getElementById("app").appendChild(renderPortfolio(document, results));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where we are — ClickChain roadmap</title>
<link rel="stylesheet" href="tree.css">
<style>
  :root { --bg: #14161a; --ink: #e8eaed; --muted: #a9b0bb; --line: #6b7280; --card: #1f232a; --edge: #8b94a3; --title-bg: #2b2347; --alert-bg: #3b1c20; --title-edge: #8a7bc0; --alert-edge: #e06a6a; --status-solved: #7ee0a0; --status-now: #ffd166; --status-next: #8ab4ff; --status-blocked: #ff8f80; --status-paused: #c9a7ff; --status-merged: #5fd7e6; --focus-ring: #14b8a5; }
  #app { padding: 24px 16px 40px; }
  section[aria-label="Forecast inputs"] { max-width: 520px; margin: 24px auto 0; font-size: 13px; color: var(--muted); }
  section[aria-label="Recent decisions"] { max-width: 520px; margin: 24px auto 0; font-size: 13px; color: var(--muted); }
  section[aria-label="Recent decisions"] > h2 { color: var(--ink); font-size: 15px; }
  section[aria-label="Reading guide"] { max-width: 520px; margin: 12px auto 24px; font-size: 13px; color: var(--muted); }
  section[aria-label="Reading guide"] summary { color: var(--ink); }
  section[aria-label="Parked for later"] > h2 { color: var(--ink); font-size: 15px; margin: 24px 0 6px; }
  #app > div > p { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
  #app > div > p[role="alert"] { text-align: left; color: var(--ink); font-size: 15px; }
</style>
</head>
<body>
<p class="early-version">An early version of the ClickChain Roadmap UI, kept as a code sample. The current version is live on clickchain.ai. This repository's README has the link.</p>
<a href="portfolio.html">Back to the portfolio</a>
<div id="read-at"></div>
<main id="app"></main>
<script type="module">
  import { startTreePage } from "../src/tree-page.js";

  await startTreePage(document, {
    fetch: (path, options) => fetch(new URL(`../${path}`, location.href), options),
    search: location.search,
    schedule: (fn, ms) => setTimeout(fn, ms),
    isHidden: () => document.hidden,
    now: () => new Date().toISOString(),
    emit: (event) => console.info(JSON.stringify(event)),
  });
</script>
</body>
</html>
